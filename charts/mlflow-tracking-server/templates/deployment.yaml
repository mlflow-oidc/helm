{{- include "application.validateRedis" . -}}
{{- template "common.deployment" (list . "application.deployment") -}}
{{- define "application.deployment" -}}
{{- $secrets := default (dict) .Values.secrets -}}
{{- $mountAsFiles := default (dict) $secrets.mountAsFiles -}}
{{- $dbUpgrade := default (dict) .Values.dbUpgrade -}}
{{- /*
  Override the deployment only when a feature requires it:
  - secrets.externalSecretName adds a secretRef to envFrom (or, with mountAsFiles, env vars,
    a volumeMount and a volume), so the app container is rendered here;
  - dbUpgrade.enabled adds the db-upgrade init container after .Values.initContainers.

  Otherwise the common library renders everything natively (image, ports, args, envFrom, env,
  secretRefs, health checks, resources, security contexts, initContainers, volumeMounts,
  volumes). Lists rendered here replace the library's, so each one carries everything it needs.
*/ -}}
{{- if or $secrets.externalSecretName $dbUpgrade.enabled }}
spec:
  template:
    spec:
      {{- if $dbUpgrade.enabled }}
      initContainers:
        {{- /* The user's init containers first: a native sidecar such as a database proxy must be
               running before db-upgrade connects through it. */}}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: db-upgrade
          image: "{{ include "application.image" . }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          {{- include "common.security.containerContext" . | nindent 10 }}
          command:
            - sh
            - -c
            - |
              uri="${MLFLOW_BACKEND_STORE_URI:-}"
              if [ -z "$uri" ] && [ -n "${CONFIG_K8S_SECRETS_PATH:-}" ] && [ -f "$CONFIG_K8S_SECRETS_PATH/MLFLOW_BACKEND_STORE_URI" ]; then
                uri="$(cat "$CONFIG_K8S_SECRETS_PATH/MLFLOW_BACKEND_STORE_URI")"
              fi
              if [ -z "$uri" ]; then
                echo "dbUpgrade: MLFLOW_BACKEND_STORE_URI is not set (env, the external secret, or a mounted secret file)" >&2
                exit 1
              fi
              exec mlflow db upgrade "$uri"
          {{- include "application.envFrom" . | nindent 10 }}
          {{- include "application.env" . | nindent 10 }}
          {{- with $dbUpgrade.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "application.volumeMounts" . | nindent 10 }}
      {{- end }}
      {{- if $secrets.externalSecretName }}
      containers:
        - name: app
          image: "{{ include "application.image" . }}"
          imagePullPolicy: {{ default "IfNotPresent" .Values.image.pullPolicy }}
          {{- include "common.security.containerContext" . | nindent 10 }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ default "http" .Values.config.portName }}
              containerPort: {{ default "8080" .Values.config.port }}
              protocol: TCP
          {{- include "application.envFrom" . | nindent 10 }}
          {{- include "application.env" . | nindent 10 }}
          {{- $healthCheck := default (dict) .Values.healthCheck -}}
          {{- if eq (default "" $healthCheck.kind) "tcp" }}
          {{ include "common.healthcheck.liveness.tcp" . | nindent 10 }}
          {{ include "common.healthcheck.readiness.tcp" . | nindent 10 }}
          {{ include "common.healthcheck.startup.tcp" . | nindent 10 }}
          {{- else if ne (default "" $healthCheck.kind) "disabled" }}
          {{ include "common.healthcheck.liveness" . | nindent 10 }}
          {{ include "common.healthcheck.readiness" . | nindent 10 }}
          {{ include "common.healthcheck.startup" . | nindent 10 }}
          {{- end }}
          {{ include "common.resources" . | nindent 10 }}
          {{- include "application.volumeMounts" . | nindent 10 }}
      {{- if or $mountAsFiles.enabled .Values.volumes }}
      volumes:
        {{- if $mountAsFiles.enabled }}
        - name: mlflow-secrets
          secret:
            secretName: {{ $secrets.externalSecretName }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
{{- end -}}
