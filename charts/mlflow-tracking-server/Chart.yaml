apiVersion: v2
name: mlflow-tracking-server
description: A Helm chart for MlFlow Tracking Server
icon: https://raw.githubusercontent.com/mlflow-oidc/mlflow-oidc-auth/refs/heads/main/web-react/public/favicon.svg
type: application
version: 4.0.0
appVersion: "9.0.0"
home: https://github.com/mlflow-oidc/helm
sources:
  - https://github.com/mlflow-oidc/helm
  - https://github.com/mlflow-oidc/mlflow-tracking-server-docker
maintainers:
  - email: alex@kharkevich.org
    name: Alexander Kharkevich

dependencies:
  - name: common
    repository: oci://ghcr.io/technicaldomain/helm
    version: 2.2.0
annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Default to mlflow-oidc-auth 9.0.0, which has breaking changes; see the chart README's upgrade notes
    - kind: fixed
      description: The default image is an immutable build that exists; chart 3.0.0 defaulted to the tag 7.0.0, which was never published
    - kind: security
      description: DEFAULT_MLFLOW_PERMISSION now defaults to NO_PERMISSIONS, the plugin's own default, instead of MANAGE
