name: Check Images
description: >-
  Render each chart with its default values and fail when an image it references cannot be found
  in its registry. A chart whose default image does not exist installs into ImagePullBackOff, and
  Artifact Hub reports it as "image not found". Requires `charts_json` (from `list-charts`).
inputs:
  charts_json:
    description: JSON array of charts (from list-charts). Must be provided.
    required: true
runs:
  using: "composite"
  steps:
    - name: Check that every default image exists
      shell: bash
      env:
        CHARTS_JSON: ${{ inputs.charts_json }}
      run: |
        set -eo pipefail
        missing=0
        for row in $(echo "$CHARTS_JSON" | jq -c '.[]'); do
          name=$(echo "$row" | jq -r '.name')
          path=$(echo "$row" | jq -r '.path')
          (cd "$path" && (helm dependency build >/dev/null 2>&1 || helm dependency update >/dev/null 2>&1)) || true
          if ! rendered=$(helm template image-check "$path" 2>&1); then
            echo "::error title=Chart does not render::$name: $rendered"
            missing=1
            continue
          fi
          images=$(echo "$rendered" \
            | { grep -E '^[[:space:]]*(- )?image:' || true; } \
            | sed -E 's/^[[:space:]]*(- )?image:[[:space:]]*//; s/["'"'"']//g' \
            | sort -u)
          if [ -z "$images" ]; then
            echo "$name: renders no image"
            continue
          fi
          for image in $images; do
            if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
              echo "$name: $image exists"
            else
              echo "::error title=Image not found::$name renders $image, which does not exist in its registry"
              missing=1
            fi
          done
        done
        exit $missing

    - name: Check the default image tag is an immutable build of appVersion
      shell: bash
      env:
        CHARTS_JSON: ${{ inputs.charts_json }}
      run: |
        set -eo pipefail
        # Only mlflow-tracking-server ships a versioned image; the other charts track `latest`.
        for path in $(echo "$CHARTS_JSON" | jq -r '.[] | select(.name == "mlflow-tracking-server") | .path'); do
          python3 "${{ github.action_path }}/../../scripts/image_tags.py" check "$path"
        done
